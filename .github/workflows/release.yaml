name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: semver tag to publish
        required: true
      sha:
        description: commit the tag points at
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/alexandremahdhaoui/forge:v0.45.38
    steps:

      - name: Restore the tool store
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/forge
          key: tool-store-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tool-store-${{ runner.os }}-

      - name: Check out the workspace around this repo
        run: |
          git config --global url."https://x-access-token:${{ secrets.FORGE_CI_GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          forge clone git@github.com:alexandremahdhaoui/qod-factory.git .

      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          forge-ci release --repo "$GITHUB_REPOSITORY" --dir qod-factory --tag "$TAG" --sha "$SHA"

      - name: Name the tool store by its content
        id: tool-store-key
        if: always()
        run: |
          echo "key=$(find ~/.cache/forge -mindepth 1 -maxdepth 3 2>/dev/null | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save the tool store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/forge
          key: tool-store-${{ runner.os }}-${{ steps.tool-store-key.outputs.key }}
